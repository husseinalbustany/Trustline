# Local development database. The credentials match .env.example and are for
# development only.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: trustline
      POSTGRES_PASSWORD: trustline
      POSTGRES_DB: trustline
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trustline"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
